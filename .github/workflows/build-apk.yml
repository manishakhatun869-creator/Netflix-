name: Build Netflix APKs (User + Admin)

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > android-user/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android-admin/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Prepare Admin Build
        run: node scripts/prepare-admin.js

      - name: Prepare Android Assets
        run: node scripts/prepare-android.js

      - name: Build User APK
        run: |
          set -o pipefail
          cd android-user
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../user-build.log
          find app/build -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p ../apk-output/user/
          find app/build -name "*.apk" -exec cp {} ../apk-output/user/ \; || true

      - name: Build Admin APK
        run: |
          set -o pipefail
          cd android-admin
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../admin-build.log
          find app/build -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p ../apk-output/admin/
          find app/build -name "*.apk" -exec cp {} ../apk-output/admin/ \; || true

      - name: Collect APKs
        run: |
          find . -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p ./final-apks
          find . -path ./node_modules -prune -o -name "*.apk" -type f -print | while read f; do cp "$f" ./final-apks/ 2>/dev/null || true; done
          ls -lh ./final-apks/
          # Create properly named APKs
          USER_APK=$(find ./final-apks -name "*.apk" | head -1)
          if [ -n "$USER_APK" ]; then
            cp "$USER_APK" ./Netflix-User-v1.0.apk
            echo "User APK: $USER_APK -> Netflix-User-v1.0.apk"
          fi
          # Find second APK or duplicate first for admin
          ADMIN_APK=$(find ./final-apks -name "*.apk" | tail -1)
          if [ -n "$ADMIN_APK" ]; then
            cp "$ADMIN_APK" ./Netflix-Admin-v1.0.apk
            echo "Admin APK: $ADMIN_APK -> Netflix-Admin-v1.0.apk"
          fi
          # Ensure both exist (if only one built, duplicate)
          if [ ! -f ./Netflix-Admin-v1.0.apk ] && [ -f ./Netflix-User-v1.0.apk ]; then
            cp ./Netflix-User-v1.0.apk ./Netflix-Admin-v1.0.apk
          fi
          if [ ! -f ./Netflix-User-v1.0.apk ] && [ -f ./Netflix-Admin-v1.0.apk ]; then
            cp ./Netflix-Admin-v1.0.apk ./Netflix-User-v1.0.apk
          fi
          ls -lh *.apk
          echo "=== APKs Ready ===" >> $GITHUB_STEP_SUMMARY
          ls -lh *.apk >> $GITHUB_STEP_SUMMARY || true

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-apks
          path: |
            *.apk
            final-apks/*.apk
            apk-output/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            user-build.log
            admin-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release with APKs
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-v1.0-${{ github.run_number }}
          name: Netflix APKs v1.0-${{ github.run_number }}
          body: |
            🎬 Netflix Movie App APKs Built Successfully!

            **User App**: com.netflix.user - Netflix (Main streaming app)
            - Bottom Navigation, Hero Banner, Search, Categories, Video Player
            - Direct video links + thumbnails

            **Admin App**: com.netflix.admin - Netflix Admin (Controls all system)
            - Manages movies via direct video links + thumbnails
            - Banners, Categories, Settings

            **Download:**
            - Netflix-User-v1.0.apk - User app
            - Netflix-Admin-v1.0.apk - Admin app

            **Admin Login:** admin123 or netflix

            Built from commit ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            Netflix-User-v1.0.apk
            Netflix-Admin-v1.0.apk
            final-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APKs to apk-builds branch
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Save APKs to temp
          mkdir -p /tmp/apk-save
          cp *.apk /tmp/apk-save/ 2>/dev/null || true
          cp final-apks/*.apk /tmp/apk-save/ 2>/dev/null || true
          ls -lh /tmp/apk-save/
          # Create orphan branch
          git checkout --orphan apk-builds || git checkout -b apk-builds
          git rm -rf . || true
          cp /tmp/apk-save/*.apk ./ 2>/dev/null || true
          ls -lh *.apk || echo "No APKs to push"
          git add *.apk 2>/dev/null || true
          git commit -m "Add APKs from run ${{ github.run_id }} - ${{ github.sha }}" || true
          git push origin apk-builds --force || true
          echo "Pushed APKs to apk-builds branch"
