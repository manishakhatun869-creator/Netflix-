name: Build Netflix APKs (User + Admin)

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Prepare Admin Build
        run: node scripts/prepare-admin.js

      - name: Prepare Android Assets
        run: node scripts/prepare-android.js

      - name: Build User APK
        run: |
          set -o pipefail
          cd android-user
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../user-build.log
          echo "=== Build outputs ==="
          ls -R app/build/outputs/ || echo "No outputs"
          find app/build -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p ../apk-output/user/
          find app/build -name "*.apk" -type f -exec cp {} ../apk-output/user/ \; || true
          ls -lh ../apk-output/user/ || true

      - name: Build Admin APK
        run: |
          set -o pipefail
          cd android-admin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../admin-build.log
          echo "=== Build outputs ==="
          ls -R app/build/outputs/ || echo "No outputs"
          find app/build -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p ../apk-output/admin/
          find app/build -name "*.apk" -type f -exec cp {} ../apk-output/admin/ \; || true
          ls -lh ../apk-output/admin/ || true

      - name: Collect APKs
        if: always()
        run: |
          echo "=== Searching APKs ==="
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APKs found"
          mkdir -p ./final-apks
          find . -path ./node_modules -prune -o -name "*.apk" -type f -print | while read f; do cp "$f" ./final-apks/ 2>/dev/null || true; done
          ls -lh ./final-apks/ || true
          cp ./final-apks/*.apk ./ 2>/dev/null || true
          # Create renamed versions
          if ls ./final-apks/*.apk 1>/dev/null 2>&1; then
            FIRST=$(ls ./final-apks/*.apk | head -1)
            cp "$FIRST" ./Netflix-User-v1.0.apk || true
            cp "$FIRST" ./Netflix-Admin-v1.0.apk || true
            # If more than one, use second for admin
            SECOND=$(ls ./final-apks/*.apk | tail -1)
            if [ "$FIRST" != "$SECOND" ]; then cp "$SECOND" ./Netflix-Admin-v1.0.apk; fi
          fi
          ls -lh *.apk || echo "No APK in root"
          echo "=== Final APKs ===" >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -type f | head -20 >> $GITHUB_STEP_SUMMARY || echo "No APKs" >> $GITHUB_STEP_SUMMARY

      - name: Upload APKs (All Found)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netflix-apks
          path: |
            *.apk
            final-apks/*.apk
            apk-output/**/*.apk
            android-user/app/build/outputs/apk/**/*.apk
            android-admin/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Outputs (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            apk-output/
            final-apks/
            user-build.log
            admin-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -type f 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "No APKs found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh *.apk 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No APK in root" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### User Log Tail" >> $GITHUB_STEP_SUMMARY
          tail -100 user-build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No user log" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Admin Log Tail" >> $GITHUB_STEP_SUMMARY
          tail -100 admin-build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No admin log" >> $GITHUB_STEP_SUMMARY
