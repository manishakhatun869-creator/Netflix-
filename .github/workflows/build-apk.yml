name: Build Netflix APKs (User + Admin)

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" "build-tools;33.0.2" || true
          sdkmanager --list_installed | tail -20

      - name: Install dependencies
        run: npm ci

      - name: Build Web App (User)
        run: npm run build

      - name: Prepare Admin Build (inject admin flag)
        run: node scripts/prepare-admin.js

      - name: Prepare Android Assets (copy dist to android projects)
        run: node scripts/prepare-android.js

      - name: Build User APK (Debug)
        run: |
          cd android-user
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../user-build.log
          echo "=== User APK search ==="
          find . -name "*.apk" -type f | xargs ls -lh || echo "No APK found in android-user"
          find . -name "*.apk" -type f -exec cp {} ../Netflix-User-debug.apk \; || true
          ls -lh ../*.apk || true

      - name: Build Admin APK (Debug)
        run: |
          cd android-admin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../admin-build.log
          echo "=== Admin APK search ==="
          find . -name "*.apk" -type f | xargs ls -lh || echo "No APK found in android-admin"
          find . -name "*.apk" -type f -exec cp {} ../Netflix-Admin-debug.apk \; || true
          ls -lh ../*.apk || true

      - name: Collect APKs to Root
        run: |
          echo "=== Searching all APKs ==="
          find . -name "*.apk" -type f | xargs ls -lh || echo "No APKs found anywhere"
          # Copy any found APKs to root with proper names
          find android-user -name "*.apk" -type f -exec cp {} ./user.apk \; 2>/dev/null || true
          find android-admin -name "*.apk" -type f -exec cp {} ./admin.apk \; 2>/dev/null || true
          cp Netflix-User-debug.apk ./Netflix-User-v1.0.apk 2>/dev/null || cp user.apk ./Netflix-User-v1.0.apk 2>/dev/null || true
          cp Netflix-Admin-debug.apk ./Netflix-Admin-v1.0.apk 2>/dev/null || cp admin.apk ./Netflix-Admin-v1.0.apk 2>/dev/null || true
          # Also try to find in gradle cache or other locations
          find . -maxdepth 4 -name "*.apk" -type f | head -20
          ls -lh *.apk 2>/dev/null || echo "No APK in root"
          ls -lh ./Netflix-*.apk 2>/dev/null || true

      - name: Upload User APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-user-apk
          path: |
            **/user.apk
            **/Netflix-User*.apk
            Netflix-User*.apk
            user.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-admin-apk
          path: |
            **/admin.apk
            **/Netflix-Admin*.apk
            Netflix-Admin*.apk
            admin.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload All APKs Found
        uses: actions/upload-artifact@v4
        with:
          name: netflix-all-apks
          path: |
            **/*.apk
            *.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            user-build.log
            admin-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎬 Netflix APK Build Attempt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK Search Results" >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -type f | head -20 >> $GITHUB_STEP_SUMMARY || echo "No APKs found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh *.apk 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No APK in root" >> $GITHUB_STEP_SUMMARY
