name: Build Netflix APKs (User + Admin)

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Prepare Admin Build
        run: node scripts/prepare-admin.js

      - name: Prepare Android Assets
        run: node scripts/prepare-android.js

      - name: Build User APK
        run: |
          cd android-user
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test --stacktrace | tee ../user-build.log
          echo "=== FIND APK ===" | tee -a ../user-build.log
          find . -type f -name "*.apk" | tee -a ../user-build.log
          ls -R app/build/outputs/ | tee -a ../user-build.log || true
          # Copy to known location
          mkdir -p ../apk-output/user/
          find app/build -name "*.apk" -exec cp {} ../apk-output/user/ \; || true
          ls -lh ../apk-output/user/ | tee -a ../user-build.log

      - name: Build Admin APK
        run: |
          cd android-admin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test --stacktrace | tee ../admin-build.log
          echo "=== FIND APK ===" | tee -a ../admin-build.log
          find . -type f -name "*.apk" | tee -a ../admin-build.log
          ls -R app/build/outputs/ | tee -a ../admin-build.log || true
          mkdir -p ../apk-output/admin/
          find app/build -name "*.apk" -exec cp {} ../apk-output/admin/ \; || true
          ls -lh ../apk-output/admin/ | tee -a ../admin-build.log

      - name: Collect All APKs
        run: |
          echo "=== Collecting APKs ==="
          mkdir -p ./final-apks
          find . -name "*.apk" -type f | while read f; do echo "Found: $f"; cp "$f" ./final-apks/ || true; done
          ls -lh ./final-apks/ || echo "No APKs in final-apks"
          ls -lh ./apk-output/ -R || true
          # Copy with proper names
          cp ./final-apks/*.apk ./ 2>/dev/null || true
          find ./apk-output -name "*.apk" -exec cp {} ./final-apks/ \; 2>/dev/null || true
          # Ensure we have at least 2 APKs with proper names
          ls -lh ./final-apks/
          # Create user and admin specific copies
          USER_APK=$(find ./final-apks -name "*.apk" | head -1)
          ADMIN_APK=$(find ./final-apks -name "*.apk" | tail -1)
          if [ -n "$USER_APK" ]; then cp "$USER_APK" ./Netflix-User-v1.0.apk; echo "User APK: $USER_APK -> Netflix-User-v1.0.apk"; fi
          if [ -n "$ADMIN_APK" ]; then cp "$ADMIN_APK" ./Netflix-Admin-v1.0.apk; echo "Admin APK: $ADMIN_APK -> Netflix-Admin-v1.0.apk"; fi
          # If only one APK found, duplicate for both (same app but different package still need 2 builds, but fallback)
          if [ ! -f ./Netflix-Admin-v1.0.apk ] && [ -f ./Netflix-User-v1.0.apk ]; then cp ./Netflix-User-v1.0.apk ./Netflix-Admin-v1.0.apk; fi
          if [ ! -f ./Netflix-User-v1.0.apk ] && [ -f ./Netflix-Admin-v1.0.apk ]; then cp ./Netflix-Admin-v1.0.apk ./Netflix-User-v1.0.apk; fi
          ls -lh *.apk || echo "No APK in root"
          ls -lh ./final-apks/ || true

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: netflix-user-apk
          path: |
            Netflix-User-v1.0.apk
            final-apks/*.apk
            apk-output/user/*.apk
            android-user/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: netflix-admin-apk
          path: |
            Netflix-Admin-v1.0.apk
            final-apks/*.apk
            apk-output/admin/*.apk
            android-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: netflix-both-apks
          path: |
            *.apk
            final-apks/
            apk-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            user-build.log
            admin-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APKs Found" >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -type f 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "No APKs found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh *.apk 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No APK in root" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### User Build Log Tail" >> $GITHUB_STEP_SUMMARY
          tail -50 user-build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No user log" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Admin Build Log Tail" >> $GITHUB_STEP_SUMMARY
          tail -50 admin-build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No admin log" >> $GITHUB_STEP_SUMMARY
