name: Build Netflix APKs (User + Admin)

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > android-user/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android-admin/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Prepare Admin Build
        run: node scripts/prepare-admin.js

      - name: Prepare Android Assets
        run: node scripts/prepare-android.js

      - name: Build User APK
        id: build-user
        run: |
          set -o pipefail
          cd android-user
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --version
          echo "=== Starting Gradle Build User ==="
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../user-build.log; EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE" | tee -a ../user-build.log
          ls -R app/build/outputs/ 2>&1 | tee -a ../user-build.log || true
          find app/build -name "*.apk" -type f -exec ls -lh {} \; 2>&1 | tee -a ../user-build.log || true
          mkdir -p ../apk-output/user/
          find app/build -name "*.apk" -type f -exec cp {} ../apk-output/user/ \; 2>&1 | tee -a ../user-build.log || true
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Gradle failed with $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Build Admin APK
        id: build-admin
        run: |
          set -o pipefail
          cd android-admin
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../admin-build.log; EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE" | tee -a ../admin-build.log
          ls -R app/build/outputs/ 2>&1 | tee -a ../admin-build.log || true
          find app/build -name "*.apk" -type f -exec ls -lh {} \; 2>&1 | tee -a ../admin-build.log || true
          mkdir -p ../apk-output/admin/
          find app/build -name "*.apk" -type f -exec cp {} ../apk-output/admin/ \; 2>&1 | tee -a ../admin-build.log || true
          if [ $EXIT_CODE -ne 0 ]; then exit $EXIT_CODE; fi

      - name: Collect APKs
        if: always()
        run: |
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APKs"
          mkdir -p ./final-apks
          find . -path ./node_modules -prune -o -name "*.apk" -type f -print | while read f; do cp "$f" ./final-apks/ 2>/dev/null || true; done
          ls -lh ./final-apks/ || true
          cp ./final-apks/*.apk ./ 2>/dev/null || true
          if ls ./final-apks/*.apk 1>/dev/null 2>&1; then
            FIRST=$(ls ./final-apks/*.apk | head -1)
            cp "$FIRST" ./Netflix-User-v1.0.apk || true
            cp "$FIRST" ./Netflix-Admin-v1.0.apk || true
            SECOND=$(ls ./final-apks/*.apk | tail -1)
            if [ "$FIRST" != "$SECOND" ]; then cp "$SECOND" ./Netflix-Admin-v1.0.apk; fi
          fi
          ls -lh *.apk || echo "No APK in root"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netflix-apks
          path: |
            *.apk
            final-apks/*.apk
            apk-output/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            user-build.log
            admin-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Post Logs as Commit Comment on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let userLog = '';
            try { userLog = fs.readFileSync('user-build.log', 'utf8'); } catch(e) { userLog = 'No user log file'; }
            // Get last 3000 chars
            userLog = userLog.slice(-5000);
            const body = `❌ APK Build Failed for commit ${{ github.sha }}\n\n**User Build Log (last 5000 chars):**\n\`\`\`\n${userLog}\n\`\`\`\n\n[View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: '${{ github.sha }}',
                body: body
              });
              console.log('Created commit comment with logs');
            } catch (e) {
              console.log('Failed to create commit comment:', e.message);
              // Try creating issue
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `APK Build Failed - ${{ github.sha }}`,
                  body: body
                });
                console.log('Created issue with logs');
              } catch (e2) {
                console.log('Failed to create issue:', e2.message);
              }
            }
