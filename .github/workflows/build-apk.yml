name: Build Netflix APKs (User + Admin)

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" "build-tools;33.0.2" || true
          sdkmanager --list_installed | tail -20

      - name: Install dependencies
        run: npm ci

      - name: Build Web App (User)
        run: npm run build

      - name: Prepare Admin Build (inject admin flag)
        run: node scripts/prepare-admin.js

      - name: Prepare Android Assets (copy dist to android projects)
        run: node scripts/prepare-android.js

      - name: Verify builds
        run: |
          ls -lh dist/ | head -20
          ls -lh dist-admin/ | head -20
          ls -lh android-user/app/src/main/assets/public/ | head -10
          ls -lh android-admin/app/src/main/assets/public/ | head -10

      # --- Build User APK ---
      - name: Build User APK (Debug)
        run: |
          cd android-user
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../user-build.log
          echo "=== User APK built ==="
          find app/build -name "*.apk" -type f | xargs ls -lh || true
          ls -lh app/build/outputs/apk/debug/ || true
          cp app/build/outputs/apk/debug/app-debug.apk ../Netflix-User.apk || cp $(find app/build -name "*.apk" | head -1) ../Netflix-User.apk || true

      - name: Upload User Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-build-log
          path: user-build.log
          retention-days: 7

      # --- Build Admin APK ---
      - name: Build Admin APK (Debug)
        run: |
          cd android-admin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test --stacktrace 2>&1 | tee ../admin-build.log
          echo "=== Admin APK built ==="
          find app/build -name "*.apk" -type f | xargs ls -lh || true
          ls -lh app/build/outputs/apk/debug/ || true
          cp app/build/outputs/apk/debug/app-debug.apk ../Netflix-Admin.apk || cp $(find app/build -name "*.apk" | head -1) ../Netflix-Admin.apk || true

      - name: Upload Admin Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-log
          path: admin-build.log
          retention-days: 7

      - name: List APKs
        run: |
          echo "=== Root ==="
          ls -lh *.apk || true
          echo "=== User ==="
          find android-user -name "*.apk" -type f | xargs ls -lh || true
          echo "=== Admin ==="
          find android-admin -name "*.apk" -type f | xargs ls -lh || true

      # --- Upload Artifacts ---
      - name: Upload User APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-user-apk
          path: |
            android-user/app/build/outputs/apk/debug/*.apk
            android-user/app/build/outputs/apk/**/*.apk
            Netflix-User.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-admin-apk
          path: |
            android-admin/app/build/outputs/apk/debug/*.apk
            android-admin/app/build/outputs/apk/**/*.apk
            Netflix-Admin.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Both APKs Together
        uses: actions/upload-artifact@v4
        with:
          name: netflix-both-apks
          path: |
            android-user/app/build/outputs/apk/debug/*.apk
            android-admin/app/build/outputs/apk/debug/*.apk
            Netflix-User.apk
            Netflix-Admin.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Rename APKs for Release
        run: |
          find android-user -name "*.apk" -type f -exec cp {} ./Netflix-User-v1.0.apk \; | head -1 || true
          find android-admin -name "*.apk" -type f -exec cp {} ./Netflix-Admin-v1.0.apk \; | head -1 || true
          cp android-user/app/build/outputs/apk/debug/app-debug.apk ./Netflix-User-v1.0.apk 2>/dev/null || true
          cp android-admin/app/build/outputs/apk/debug/app-debug.apk ./Netflix-Admin-v1.0.apk 2>/dev/null || true
          ls -lh *.apk || true

      - name: Upload Renamed APKs
        uses: actions/upload-artifact@v4
        with:
          name: netflix-apks-renamed
          path: |
            Netflix-User-v1.0.apk
            Netflix-Admin-v1.0.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Build Summary
        run: |
          echo "## 🎬 Netflix APKs Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK Details" >> $GITHUB_STEP_SUMMARY
          echo "- **User App**: com.netflix.user - Netflix" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin App**: com.netflix.admin - Netflix Admin" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- netflix-user-apk, netflix-admin-apk, netflix-both-apks, netflix-apks-renamed" >> $GITHUB_STEP_SUMMARY
